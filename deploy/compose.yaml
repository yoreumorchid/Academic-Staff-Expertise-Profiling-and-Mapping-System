name: expertise-insight-pilot

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-pilot}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?set APP_CORS_ORIGINS in deploy/.env}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL in deploy/.env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-480}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  MAX_DOCUMENT_UPLOAD_BYTES: ${MAX_DOCUMENT_UPLOAD_BYTES:-10485760}
  MAX_CSV_UPLOAD_BYTES: ${MAX_CSV_UPLOAD_BYTES:-2097152}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in deploy/.env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in deploy/.env}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_API_BASE: ${LLM_API_BASE:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  SCIBERT_MODEL: ${SCIBERT_MODEL:-allenai/scibert_scivocab_uncased}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  MAX_PUBLICATIONS_PER_SYNC: ${MAX_PUBLICATIONS_PER_SYNC:-30}
  APP_LOG_FORMAT: json
  APP_LOG_LEVEL: INFO

x-backend-dependencies: &backend-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    build:
      context: ../backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on: *backend-dependencies
    volumes:
      - huggingface-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-environment
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
      - --hostname=worker@%h
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on: *backend-dependencies
    volumes:
      - huggingface-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  beat:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-environment
    command:
      - celery
      - -A
      - app.worker.celery_app
      - beat
      - --loglevel=INFO
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/var/lib/celery/celerybeat-schedule
    depends_on: *backend-dependencies
    volumes:
      - beat-data:/var/lib/celery
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  postgres-data:
  redis-data:
  beat-data:
  huggingface-cache:
  caddy-data:
  caddy-config:
